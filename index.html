<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Golden MYG · Catálogo</title>
  <meta name="description" content="Bolsos y collares de Golden MYG." />
  <link rel="icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Mismos colores que la app (src/theme/theme.ts) */
    :root {
      --bg: #F4F2F5; --surface: #FFFFFF; --text: #2A1D2E; --text-2: #5E5263; --muted: #8F8494;
      --border: #E3DEE5; --header: #3A2340; --header-text: #F6EFE6;
      --selected: #EBD3D0; --selected-text: #4A2A33; --accent: #9A7A43; --overlay: rgba(42, 29, 46, .6);
      --display: 'Bodoni Moda', Georgia, serif; --body: 'Manrope', system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17111A; --surface: #221A26; --text: #F3EDF4; --text-2: #C9BECD; --muted: #93879A;
        --border: #352A3A; --header: #110C13; --header-text: #F3EDF4;
        --selected: #4A3350; --selected-text: #F3EDF4; --accent: #D2B27A; --overlay: rgba(0, 0, 0, .7);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); }
    img { display: block; max-width: 100%; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    header { background: var(--header); color: var(--header-text); }
    .bar { max-width: 1120px; margin: 0 auto; padding: 18px 16px; display: flex; align-items: center; gap: 12px; }
    .bar img { width: 40px; height: 40px; border-radius: 50%; }
    .bar h1 { font-family: var(--display); font-weight: 600; font-size: 26px; margin: 0; letter-spacing: .01em; }

    main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }
    .search {
      width: 100%; max-width: 420px; font: 400 16px var(--body); color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 12px 18px;
    }
    .search::placeholder { color: var(--muted); }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .tab {
      border: 0; background: none; padding: 8px 15px; border-radius: 999px;
      font-weight: 500; font-size: 15px; color: var(--text-2);
    }
    .tab[aria-selected="true"] { background: var(--selected); color: var(--selected-text); font-weight: 700; }
    .count { color: var(--muted); font-size: 14px; margin: 16px 0; min-height: 1.4em; }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 14px; }
    @media (min-width: 700px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px 22px; } }
    @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .card { border: 0; background: none; padding: 0; text-align: left; }
    .card .photo { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 6px; background: var(--border); }
    .card .noimg { display: grid; place-items: center; color: var(--muted); font-size: 13px; }
    .card h2 { font-family: var(--display); font-weight: 500; font-size: 18px; line-height: 1.2; margin: 10px 0 0; }
    .card .price { font-weight: 600; font-size: 14px; color: var(--text-2); margin-top: 4px; }

    .empty { text-align: center; padding: 72px 16px; color: var(--text-2); }
    .empty h2 { font-family: var(--display); font-weight: 500; font-size: 24px; color: var(--text); margin: 0 0 8px; }

    /* Detalle */
    dialog {
      border: 0; padding: 0; width: min(960px, 100vw); max-width: 100vw; max-height: 100dvh;
      background: var(--bg); color: var(--text); border-radius: 10px;
    }
    dialog::backdrop { background: var(--overlay); }
    @media (max-width: 699px) { dialog { width: 100vw; height: 100dvh; border-radius: 0; margin: 0; } }
    .detail { display: grid; grid-template-columns: 1fr; }
    @media (min-width: 700px) { .detail { grid-template-columns: 1.1fr 1fr; } }
    .gallery { position: relative; background: var(--border); }
    .slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .slides::-webkit-scrollbar { display: none; }
    .slides img { flex: 0 0 100%; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; scroll-snap-align: start; }
    .dots { display: flex; justify-content: center; gap: 6px; padding: 12px 0 0; }
    .dots span { width: 6px; height: 6px; border-radius: 3px; background: var(--border); transition: width .2s; }
    .dots span.on { width: 18px; background: var(--text); }
    .info { padding: 20px 20px 32px; }
    .info h2 { font-family: var(--display); font-weight: 500; font-size: 32px; line-height: 1.15; margin: 0; }
    .info .price { font-family: var(--display); font-weight: 600; font-size: 24px; color: var(--accent); margin-top: 6px; }
    .specs { margin: 22px 0 0; border-top: 1px solid var(--border); }
    .specs div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .specs dt { color: var(--muted); }
    .specs dd { margin: 0; font-weight: 600; text-align: right; }
    .desc { color: var(--text-2); line-height: 1.6; margin-top: 18px; white-space: pre-line; max-width: 60ch; }
    .close {
      position: absolute; top: 12px; right: 12px; z-index: 1; width: 40px; height: 40px; border-radius: 50%;
      border: 0; background: var(--surface); color: var(--text); font-size: 20px; line-height: 1;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
    }
    @media (prefers-reduced-motion: reduce) { .dots span { transition: none; } .slides { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <img src="logo.png" alt="" width="40" height="40" />
      <h1>Golden MYG</h1>
    </div>
  </header>

  <main>
    <input class="search" id="search" type="search" placeholder="Buscar por nombre" aria-label="Buscar por nombre" />
    <div class="tabs" role="tablist" id="tabs"></div>
    <p class="count" id="count" aria-live="polite">Cargando catálogo…</p>
    <div class="grid" id="grid"></div>
  </main>

  <dialog id="dialog" aria-label="Detalle del producto">
    <button class="close" id="close" aria-label="Cerrar">✕</button>
    <div class="detail">
      <div>
        <div class="gallery"><div class="slides" id="slides"></div></div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="info">
        <h2 id="d-name"></h2>
        <p class="price" id="d-price"></p>
        <dl class="specs" id="d-specs"></dl>
        <p class="desc" id="d-desc"></p>
      </div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"
    integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+" crossorigin="anonymous"></script>
  <script>
    // Clave PÚBLICA (anon): en Supabase solo permite leer el catálogo. Editar
    // requiere iniciar sesión en la app con una cuenta autorizada.
    const SUPABASE_URL = 'https://khvaqdzxotqfwqjzzbem.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtodmFxZHp4b3RxZndxanp6YmVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NDgxMjUsImV4cCI6MjEwODUyNDEyNX0.srgQrVOw84ACH2ZLZXlKbJRQNsnUcUdZKF8z_EQnVBo';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });

    const CATEGORIES = [['Todos', 'Todo'], ['Bolso', 'Bolsos'], ['Collar', 'Collares'], ['Otro', 'Otros']];
    let products = [];
    let category = 'Todos';
    let query = '';

    const $ = (id) => document.getElementById(id);
    const el = (tag, props = {}, children = []) => {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    };

    // Igual que src/utils/format.ts de la app: 20000 → $20.000
    function formatPrice(raw) {
      const text = String(raw).trim().replace(/^\$\s*/, '');
      const digits = text.replace(/\./g, '');
      return /^\d+$/.test(digits) ? '$' + digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '$' + text;
    }

    function renderTabs() {
      $('tabs').replaceChildren(...CATEGORIES.map(([value, label]) => {
        const tab = el('button', { className: 'tab', textContent: label, role: 'tab' });
        tab.setAttribute('aria-selected', String(value === category));
        tab.onclick = () => { category = value; renderTabs(); renderGrid(); };
        return tab;
      }));
    }

    function renderGrid() {
      const q = query.trim().toLowerCase();
      const list = products.filter((p) =>
        (category === 'Todos' || p.category === category) &&
        (!q || p.name.toLowerCase().includes(q) || (p.code || '').toLowerCase().includes(q)));

      $('count').textContent = category === 'Todos' && !q
        ? `${products.length} ${products.length === 1 ? 'producto' : 'productos'}`
        : `${list.length} de ${products.length}`;

      if (list.length === 0) {
        $('grid').replaceChildren(el('div', { className: 'empty', style: 'grid-column: 1 / -1' }, [
          el('h2', { textContent: products.length ? 'Nada por aquí' : 'Pronto habrá productos' }),
          el('p', { textContent: products.length ? 'Prueba con otra categoría o borra la búsqueda.' : 'Vuelve en un rato.' }),
        ]));
        return;
      }

      $('grid').replaceChildren(...list.map((p) => {
        const photo = p.photos?.[0]
          ? el('img', { className: 'photo', src: p.photos[0], alt: p.name, loading: 'lazy' })
          : el('div', { className: 'photo noimg', textContent: 'Sin foto' });
        const card = el('button', { className: 'card' }, [
          photo,
          el('h2', { textContent: p.name }),
          ...(p.price ? [el('p', { className: 'price', textContent: formatPrice(p.price) })] : []),
        ]);
        card.onclick = () => openDetail(p);
        return card;
      }));
    }

    function openDetail(p) {
      const photos = p.photos || [];
      $('slides').replaceChildren(...photos.map((src, i) => el('img', { src, alt: `${p.name}, foto ${i + 1}` })));
      $('dots').replaceChildren(...(photos.length > 1 ? photos.map((_, i) => el('span', { className: i === 0 ? 'on' : '' })) : []));
      $('slides').scrollLeft = 0;
      $('d-name').textContent = p.name;
      $('d-price').textContent = p.price ? formatPrice(p.price) : '';
      const specs = [['Categoría', p.category], ['Material', p.material], ['Medidas', p.measurements],
        ['Colores', (p.colors || []).join(', ')]].filter(([, v]) => v);
      $('d-specs').replaceChildren(...specs.map(([k, v]) => el('div', {}, [el('dt', { textContent: k }), el('dd', { textContent: v })])));
      $('d-desc').textContent = p.description || '';
      $('dialog').showModal();
    }

    $('slides').addEventListener('scroll', () => {
      const s = $('slides');
      const index = Math.round(s.scrollLeft / s.clientWidth);
      [...$('dots').children].forEach((dot, i) => dot.classList.toggle('on', i === index));
    }, { passive: true });
    $('close').onclick = () => $('dialog').close();
    $('dialog').addEventListener('click', (e) => { if (e.target === $('dialog')) $('dialog').close(); });
    $('search').addEventListener('input', (e) => { query = e.target.value; renderGrid(); });

    async function load() {
      const { data, error } = await db.from('productos').select('*').order('created_at', { ascending: false });
      if (error) {
        $('count').textContent = 'No se pudo cargar el catálogo. Revisa tu conexión y recarga la página.';
        return;
      }
      products = data;
      renderGrid();
    }

    renderTabs();
    load();
    // Cuando alguien edita desde la app, la página se actualiza sola.
    db.channel('catalogo-web')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'productos' }, load)
      .subscribe();
  </script>
</body>
</html>
